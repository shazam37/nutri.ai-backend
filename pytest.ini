[pytest]
# Run tests in filename order (01, 02, 03...) to preserve state dependencies
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings
    --strict-markers

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective runs
markers =
    auth: Authentication tests
    users: User profile tests
    meals: Meal logging tests
    inventory: Inventory tests
    history: History and edit tests
    plans: Meal plan tests
    utils: Water, micros, device token tests
    agents: Agent and scheduler tests
    slow: Tests that make multiple AI calls (may be slow)