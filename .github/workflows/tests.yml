name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutriai
          POSTGRES_PASSWORD: nutriai
          POSTGRES_DB: nutriai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://nutriai:nutriai@localhost:5432/nutriai
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-key' }}
        USDA_API_KEY: ${{ secrets.USDA_API_KEY || 'test-key' }}
        JWT_SECRET: test-secret-key-at-least-32-characters-long-1234
      run: |
        pytest tests/ -v --tb=short
